# Development-only Compose stack. Do not use for a public or production deployment;
# use docker-compose.prod.yml together with deploy/nginx/paperforge.conf instead.
name: paperforge-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-paperforge}
      POSTGRES_USER: ${POSTGRES_USER:-paperforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before starting Docker Compose}
    ports:
      - "5432:5432"
    volumes:
      - paperforge-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-paperforge} -d ${POSTGRES_DB:-paperforge}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./paper-ai/backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-paperforge}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before starting Docker Compose}@postgres:5432/${POSTGRES_DB:-paperforge}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env before starting Docker Compose}
      APP_ENV: development
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-1440}
      AUTH_REQUIRED: ${AUTH_REQUIRED:-true}
      PAPERFORGE_PREVIEW_AUTO_LOGIN: ${PAPERFORGE_PREVIEW_AUTO_LOGIN:-false}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      AUTO_CREATE_DB: "false"
    ports:
      - "8000:8000"
    command: ["sh", "-c", "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./paper-ai/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
        NEXT_PUBLIC_PAPERFORGE_PREVIEW_AUTO_LOGIN: ${NEXT_PUBLIC_PAPERFORGE_PREVIEW_AUTO_LOGIN:-false}
        NEXT_PUBLIC_PAPERFORGE_APP_ENV: ${NEXT_PUBLIC_PAPERFORGE_APP_ENV:-development}
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  paperforge-postgres-data:
