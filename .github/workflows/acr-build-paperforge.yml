name: PaperForge immutable ACR build

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Full release commit SHA to build
        required: true
        type: string
      release_version:
        description: Immutable PaperForge image tag, for example v3.7.3
        required: true
        default: v3.7.3
        type: string
  push:
    tags:
      - paperforge-v*

permissions:
  contents: read

env:
  ACR_REGISTRY: crpi-z345rofd99au0che.cn-chengdu.personal.cr.aliyuncs.com/paperforge
  NEXT_PUBLIC_API_BASE_URL: https://aetherislab.xyz/api
  NEXT_PUBLIC_PAPERFORGE_PREVIEW_AUTO_LOGIN: 'false'
  NEXT_PUBLIC_PAPERFORGE_APP_ENV: production

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_commit || github.sha }}
          fetch-depth: 1

      - name: Verify release source
        shell: bash
        env:
          REQUESTED_COMMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.source_commit || github.sha }}
          REQUESTED_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.release_version || github.ref_name }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="${REQUESTED_COMMIT}"
          test "${actual}" = "${expected}"
          release_version="${REQUESTED_VERSION#paperforge-}"
          [[ "${release_version}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "Release commit: ${actual}"
          echo "Release version: ${release_version}"
          echo "RELEASE_VERSION=${release_version}" >> "${GITHUB_ENV}"
          echo "SOURCE_COMMIT=${actual}" >> "${GITHUB_ENV}"

      - name: Login to Alibaba Cloud ACR
        shell: bash
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${ACR_USERNAME}"
          test -n "${ACR_PASSWORD}"
          printf '%s' "${ACR_PASSWORD}" | docker login "${ACR_REGISTRY%%/*}" --username "${ACR_USERNAME}" --password-stdin

      - name: Build backend image
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --label "com.paperforge.release=${RELEASE_VERSION}" \
            --label "com.paperforge.commit=${SOURCE_COMMIT}" \
            --tag "${ACR_REGISTRY}/paperforge-backend:${RELEASE_VERSION}" \
            paper-ai/backend

      - name: Build frontend image with public build arguments
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --build-arg "NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL}" \
            --build-arg "NEXT_PUBLIC_PAPERFORGE_PREVIEW_AUTO_LOGIN=${NEXT_PUBLIC_PAPERFORGE_PREVIEW_AUTO_LOGIN}" \
            --build-arg "NEXT_PUBLIC_PAPERFORGE_APP_ENV=${NEXT_PUBLIC_PAPERFORGE_APP_ENV}" \
            --label "com.paperforge.release=${RELEASE_VERSION}" \
            --label "com.paperforge.commit=${SOURCE_COMMIT}" \
            --tag "${ACR_REGISTRY}/paperforge-frontend:${RELEASE_VERSION}" \
            paper-ai/frontend

      - name: Push immutable application images
        shell: bash
        run: |
          set -euo pipefail
          docker push "${ACR_REGISTRY}/paperforge-backend:${RELEASE_VERSION}"
          docker push "${ACR_REGISTRY}/paperforge-frontend:${RELEASE_VERSION}"

      - name: Record remote image digests
        shell: bash
        run: |
          set -euo pipefail
          backend_image="${ACR_REGISTRY}/paperforge-backend:${RELEASE_VERSION}"
          frontend_image="${ACR_REGISTRY}/paperforge-frontend:${RELEASE_VERSION}"
          docker buildx imagetools inspect "${backend_image}"
          docker buildx imagetools inspect "${frontend_image}"
          backend_digest="$(docker buildx imagetools inspect "${backend_image}" | sed -n 's/^Digest: //p' | head -n 1)"
          frontend_digest="$(docker buildx imagetools inspect "${frontend_image}" | sed -n 's/^Digest: //p' | head -n 1)"
          test -n "${backend_digest}"
          test -n "${frontend_digest}"
          {
            echo '## PaperForge release image facts'
            echo "- Release: `${RELEASE_VERSION}`"
            echo "- Source commit: `${SOURCE_COMMIT}`"
            echo "- Backend image: `${backend_image}@${backend_digest}`"
            echo "- Frontend image: `${frontend_image}@${frontend_digest}`"
            echo '- Frontend build args: `NEXT_PUBLIC_API_BASE_URL=https://aetherislab.xyz/api`, `NEXT_PUBLIC_PAPERFORGE_PREVIEW_AUTO_LOGIN=false`, `NEXT_PUBLIC_PAPERFORGE_APP_ENV=production`'
          } >> "${GITHUB_STEP_SUMMARY}"
